{% extends "layout.html" %}

{% block title %}Entrar | Spartan{% endblock %}

{% block main %}

<section class="auth-page">

    <div class="auth-brand">

        <span class="section-label">SPARTAN TRAINING SYSTEM</span>

        <h1>Bem-vindo de volta.</h1>

        <p>Entre na sua conta para acessar seus treinos.</p>

    </div>


    <div class="auth-card">

        <div class="auth-card-header">
            <h2>Entrar</h2>
            <p>Informe suas credenciais.</p>
        </div>


        <form method="post">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label for="username">Usuário</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Seu usuário"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label for="password">Senha</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button class="btn-primary auth-submit" type="submit">
                Entrar
            </button>

        </form>


        <div class="auth-footer">
            <span>Ainda não possui uma conta?</span>
            <a href="{{ url_for('register') }}">Criar conta</a>
        </div>

    </div>

</section>

{% endblock %}
